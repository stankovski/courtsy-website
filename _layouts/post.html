---
layout: default
---

<section class="article-hero">
  <div class="section-inner">
    <p class="eyebrow">{{ page.category | default: 'Guides' }}</p>
    <h1>{{ page.title }}</h1>
    <p class="article-meta">{{ page.date | date: '%B %-d, %Y' }}</p>
  </div>
</section>

<article class="article-content">
  {{ content }}
</article>
